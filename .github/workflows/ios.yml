name: iOS

# PhrenKit's markdown parsers are line-by-line transcriptions of the CLI's
# TypeScript, verified against fixtures the CLI generates (see
# apps/ios/README.md "The format contract"). A change to either side of that
# contract must run this suite — otherwise a TS format change silently
# desyncs the Swift port and nothing fails until a user's file is mangled.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
      - "packages/cli/src/content/**"
      - "packages/cli/src/data/**"
      - "packages/cli/src/finding/**"
      - "packages/cli/src/governance/policy.ts"
      - "packages/cli/src/core/**"
      - "packages/cli/src/task/**"
      - "packages/cli/src/skill/**"
      - "packages/cli/browser/**"
      - "packages/cli/src/graph-core/**"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
      - "packages/cli/src/content/**"
      - "packages/cli/src/data/**"
      - "packages/cli/src/finding/**"
      - "packages/cli/src/governance/policy.ts"
      - "packages/cli/src/core/**"
      - "packages/cli/src/task/**"
      - "packages/cli/src/skill/**"
      - "packages/cli/browser/**"
      - "packages/cli/src/graph-core/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:

jobs:
  phrenkit-tests:
    name: PhrenKit tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # SwiftNIO's current dependency graph requires Swift 6.2. macos-15
      # still defaults to Xcode 16.4; select the installed compatible toolchain.
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: swift test
        working-directory: apps/ios/PhrenKit
        run: swift test
      - name: SSH connection tests
        working-directory: apps/ios/PhrenLive
        run: swift test

  app-build:
    name: App smoke build (iOS Simulator)
    runs-on: macos-15
    needs: phrenkit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install graph renderer dependencies
        run: pnpm install --frozen-lockfile
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -project Phren.xcodeproj \
            -scheme Phren \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Install graph test browser
        run: pnpm exec playwright install chromium
      - name: Test phone graph renderer
        run: node --test apps/ios/scripts/test-graph.mjs
      - name: Test native graph navigation
        # Ad hoc simulator signing supplies Keychain entitlements without a
        # developer certificate; PHRENTEST01 is a synthetic test team prefix.
        working-directory: apps/ios
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/phren-devices.json"
          PHREN_TEST_DEVICE_ID=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))' "$RUNNER_TEMP/phren-devices.json")
          xcodebuild test -project Phren.xcodeproj -scheme Phren \
            -destination "platform=iOS Simulator,id=$PHREN_TEST_DEVICE_ID" \
            -resultBundlePath "$RUNNER_TEMP/PhrenUITests.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=PHRENTEST01
      - name: Save native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhrenUITests
          path: ${{ runner.temp }}/PhrenUITests.xcresult
          if-no-files-found: ignore
